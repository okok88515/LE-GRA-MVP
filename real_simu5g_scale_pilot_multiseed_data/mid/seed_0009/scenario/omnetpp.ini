# P3.9 scale pilot scenario -- same network TOPOLOGY as the validated P3.7
# 24-vehicle scenario (netgenerate 3x3 grid, unregulated center junction,
# same 4 cross-routes), scaled up via grid.length 200m->400m (800x800m,
# ~4x area) and vehicle count 24->50 (~4x, matching the area
# scale-up to hold density roughly constant). gNB positions scaled
# proportionally to the same relative offset from center; tx power per
# dispersion level carried over UNCHANGED from P3.7 pending phase-2
# CQI-histogram-only calibration (NOT yet validated for this scale).
#
# The base route file adds departSpeed="max" departPos="base" to every
# vehicle -- without it, ~30% of vehicles never insert within the 90s
# window (SUMO's default from-rest insertion can't keep up with 100
# vehicles at this stagger; found and fixed during SUMO-only pilot testing,
# see REAL_SIMU5G_SCALE_PILOT.md).

[General]
cmdenv-autoflush = true
network = simu5g.simulations.nr.cars.Highway

debug-on-errors = false
print-undisposed = false
sim-time-limit = 90s

**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.routingRecorder.enabled = false

*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m

*.veinsManager.host = "localhost"
*.veinsManager.moduleType = "simu5g.nodes.NrCar"
*.veinsManager.moduleName = "car"
*.veinsManager.launchConfig = xmldoc("heterogeneous.launchd.xml")
*.veinsManager.updateInterval = 0.1s

*.car[*].mobility.typename = "VeinsInetMobility"

**.numBands = 25
**.ueTxPower = 10dBm
**.eNodeBTxPower = 15dBm

*.gNodeB1.mobility.initialX = 400m
*.gNodeB1.mobility.initialY = 160m
*.gNodeB2.mobility.initialX = 400m
*.gNodeB2.mobility.initialY = 640m

*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.car[*].servingNodeId = 0
*.car[*].nrServingNodeId = 1

**.gNodeB1.macCellId = 1
**.gNodeB1.macNodeId = 1
**.gNodeB2.macCellId = 2
**.gNodeB2.macNodeId = 2

*.car[*].cellularNic.nrPhy.enableHandover = true
*.gNodeB*.cellularNic.phy.enableHandover = true
*.gNodeB*.cellularNic.phy.handoverLatency = 50ms
*.gNodeB*.cellInfo.broadcastMessageInterval = 1s

*.gNodeB*.numX2Apps = 1
*.gNodeB*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gNodeB1.x2App[0].client.connectAddress = "gNodeB2%x2ppp0"
*.gNodeB2.x2App[0].client.connectAddress = "gNodeB1%x2ppp0"
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false

[Config P3_9_Scale_Pilot_DL]
*.server.numApps = 50
*.server.app[*].typename = "VoipSender"
*.server.app[*].localPort = 3000 + ancestorIndex(0)
*.server.app[*].destAddress = "car[" + string(ancestorIndex(0)) + "]"
*.server.app[*].startTime = uniform(0.05s, 0.30s)

*.car[*].numApps = 1
*.car[*].app[0].typename = "VoipReceiver"

# Multi-seed reproducibility overrides
seed-set = 9
**.scalar-recording = false
**.vector-recording = false
