# P3.6e split-pressure coupled scenario derived from Simu5G NR cars.

[General]
cmdenv-autoflush = true
network = simu5g.simulations.nr.cars.Highway

debug-on-errors = false
print-undisposed = false
sim-time-limit = 45s

**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.routingRecorder.enabled = false

*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m

*.veinsManager.host = "localhost"
*.veinsManager.moduleType = "simu5g.nodes.NrCar"
*.veinsManager.moduleName = "car"
*.veinsManager.launchConfig = xmldoc("heterogeneous.launchd.xml")
*.veinsManager.updateInterval = 0.1s

**.numBands = 25
**.ueTxPower = 18dBm
**.eNodeBTxPower = 26dBm

*.gNodeB1.mobility.initialX = 140m
*.gNodeB1.mobility.initialY = 120m
*.gNodeB2.mobility.initialX = 320m
*.gNodeB2.mobility.initialY = 280m

*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.car[*].servingNodeId = 0
*.car[*].nrServingNodeId = 1

**.gNodeB1.macCellId = 1
**.gNodeB1.macNodeId = 1
**.gNodeB2.macCellId = 2
**.gNodeB2.macNodeId = 2

*.car[*].cellularNic.nrPhy.enableHandover = true
*.gNodeB*.cellularNic.phy.enableHandover = true
*.gNodeB*.cellularNic.phy.handoverLatency = 50ms
*.gNodeB*.cellInfo.broadcastMessageInterval = 1s

*.gNodeB*.numX2Apps = 1
*.gNodeB*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gNodeB1.x2App[0].client.connectAddress = "gNodeB2%x2ppp0"
*.gNodeB2.x2App[0].client.connectAddress = "gNodeB1%x2ppp0"
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false

[Config P3_6E_SplitPressure_DL]
*.server.numApps = 32
*.server.app[*].typename = "VoipSender"
*.server.app[*].localPort = 3000 + ancestorIndex(0)
*.server.app[*].destAddress = "car[" + string(ancestorIndex(0)) + "]"
*.server.app[*].startTime = uniform(0.05s, 0.25s)

*.car[*].numApps = 1
*.car[*].app[0].typename = "VoipReceiver"
