<script>
/* ---------- shared method identity ---------- */
const DISP_METHODS = [
  { key: "no_grouping", label: "No grouping",          short: "不分組",       color: "var(--s1)" },
  { key: "cqi",         label: "CQI k-means",           short: "CQI",         color: "var(--s2)" },
  { key: "cost",        label: "Resource-cost k-means",  short: "Resource-cost", color: "var(--s3)" },
  { key: "multi",       label: "Multi-feature k-means",  short: "Multi-feature", color: "var(--s4)" },
  { key: "teacher",     label: "近似最優解(multikey修正版)", short: "近似最優解",   color: "var(--s5)", ceiling: true },
  { key: "hybrid4",     label: "CQI+Cost+Joint+Switching 候選聯集(我們的方法)", short: "候選聯集(我們)", color: "var(--s7)", ours: true },
];

/* ---------- dispersion-stratified data (50 users, aligned mode, medium load, 30 seeds x 20 scenarios/cell) ----------
   "mid" here uses a recalibrated CQI-dispersion formula ("mid_v2" in le_gra_mvp.py): the
   original "mid" branch rarely pushed worst-case CQI below ~9 (checked directly: p5=9 across
   720 draws), so a single unified "no grouping" bottleneck stayed mild -- unlike the published
   paper's own mid-dispersed condition. mid_v2 widens the distance range and steepens the slope
   so a real low-CQI tail exists, calibrated against the resulting CQI histogram alone (not
   against any grouping-method outcome) before this comparison was run. Also moved from 24 to
   50 users, matching the paper's own single-MMS scale (Section 4: "when the number of VUs is
   50") -- confirmed directly that user count amplifies the no-grouping collapse independently
   of dispersion (e.g. mid_v2 ADR: no-grouping was 84% of teacher at 24 users, 65% at 50 users). */
const DISPERSIONS = [
  { key: "low",  label: "Low-dispersed(集中)" },
  { key: "mid",  label: "Mid-dispersed(重新校準)" },
  { key: "high", label: "High-dispersed(分散)" },
];

/* teacher = multikey-corrected near-optimal for utility (validated true ceiling, see
   teacher-contiguity-limitation memory); for the other 5 metrics teacher uses the cheap
   "_fast" DP instead (no multikey ADR/fairness data collected) -- still a reasonable
   reference for those, just not re-verified as the exact global optimum on those metrics. */
const DISP_DATA = {
  utility: {
    low:  { no_grouping: 0.9318, cqi: 0.9408, cost: 0.9329, multi: 0.9429, teacher: 0.9515, hybrid4: 0.9514 },
    mid:  { no_grouping: 0.6702, cqi: 0.7055, cost: 0.7359, multi: 0.7281, teacher: 0.7781, hybrid4: 0.7464 },
    high: { no_grouping: 0.1229, cqi: 0.3756, cost: 0.3210, multi: 0.3584, teacher: 0.4417, hybrid4: 0.3946 },
  },
  adr_kbps: {
    low:  { no_grouping: 7500.00, cqi: 6974.45, cost: 7436.56, multi: 6828.87, teacher: 7374.09, hybrid4: 6351.44 },
    mid:  { no_grouping: 2923.42, cqi: 3665.43, cost: 4502.99, multi: 3995.55, teacher: 4847.06, hybrid4: 4640.99 },
    high: { no_grouping: 550.00,  cqi: 1979.57, cost: 1340.33, multi: 1759.27, teacher: 1877.63, hybrid4: 1812.62 },
  },
  served_ratio: {
    low:  { no_grouping: 1.0000, cqi: 1.0000, cost: 1.0000, multi: 1.0000, teacher: 1.0000, hybrid4: 1.0000 },
    mid:  { no_grouping: 1.0000, cqi: 1.0000, cost: 0.9997, multi: 1.0000, teacher: 0.9980, hybrid4: 0.9997 },
    high: { no_grouping: 1.0000, cqi: 1.0000, cost: 0.9914, multi: 0.9965, teacher: 0.9994, hybrid4: 0.9987 },
  },
  average_quality: {
    low:  { no_grouping: 5.0000, cqi: 4.6909, cost: 4.9627, multi: 4.6056, teacher: 4.9259, hybrid4: 4.3244 },
    mid:  { no_grouping: 2.9483, cqi: 3.0626, cost: 3.3436, multi: 3.2008, teacher: 3.5351, hybrid4: 3.4067 },
    high: { no_grouping: 1.0000, cqi: 1.7932, cost: 1.6146, multi: 1.7755, teacher: 1.9552, hybrid4: 1.8212 },
  },
  system_spectral_efficiency: {
    low:  { no_grouping: 250.00, cqi: 232.48, cost: 247.89, multi: 227.63, teacher: 245.80, hybrid4: 211.71 },
    mid:  { no_grouping: 97.45,  cqi: 122.18, cost: 150.10, multi: 133.19, teacher: 161.57, hybrid4: 154.70 },
    high: { no_grouping: 18.33,  cqi: 65.99,  cost: 44.68,  multi: 58.64,  teacher: 62.59,  hybrid4: 60.42 },
  },
  fairness: {
    low:  { no_grouping: 1.0000, cqi: 0.9880, cost: 0.9981, multi: 0.9856, teacher: 0.9964, hybrid4: 0.9847 },
    mid:  { no_grouping: 1.0000, cqi: 0.7996, cost: 0.8365, multi: 0.8317, teacher: 0.8748, hybrid4: 0.8510 },
    high: { no_grouping: 1.0000, cqi: 0.6267, cost: 0.7906, multi: 0.6459, teacher: 0.7100, hybrid4: 0.6753 },
  },
};

const METRIC_META = [
  { id: "utility",    title: "效用分數 (Utility Score)",     unit: "", decimals: 3,
    insight: "150人規模：<strong>我們的方法(候選聯集)在低離散度已經幾乎完全逼近真正的近似最優解</strong>(0.9514 vs 0.9515，只差0.0001)；中離散度達最優解的 <strong>95.9%</strong>(CQI只有90.7%)；高離散度達 <strong>89.3%</strong>(CQI 85.0%)，是目前離最優解最遠的一格，還有進步空間。這裡的「近似最優解」用的是已驗證的多排序鍵ensemble修正版(offline_teacher_groups_multikey)，不是單一排序鍵的DP——修正前的版本在低離散度甚至會輸給multi-feature/CQI k-means(見後面方法邏輯頁的完整說明)，換成修正版後才真正是每一格最高分。" },
  { id: "adr_kbps",   title: "平均資料速率 ADR (kbps)",       unit: " kbps", decimals: 0,
    insight: "150人規模：中離散度時「不分組」ADR 只剩最優解的 <strong>60.3%</strong>，高離散度崩到 <strong>27.8%</strong>(原論文 Method C 在高離散度是 15.2%，量級相符)。<strong>我們的方法在中離散度ADR(95.7%)反而贏過CQI(75.6%)</strong>，但低/高離散度時ADR略低於CQI——這不是缺陷：我們的方法選分組是為了最大化utility(含公平性、換頻穩定性)，不是原始平均速率，兩者目標本來就不同，ADR只是附帶觀察到的結果，不是被優化的對象(見「Utility 公式」頁)。" },
  { id: "served_ratio", title: "服務覆蓋率 (Served Ratio)",   unit: "", decimals: 4, isPercentMetric: true,
    insight: "這項指標在所有離散度、所有方法下都貼著 100%——不太能區分方法優劣，真正的差異在「服務到什麼畫質」，不是「有沒有服務到」(見左側 ADR / 畫質等級)。" },
  { id: "average_quality", title: "平均畫質等級 (0–5)",        unit: " 級", decimals: 2,
    insight: "高離散度時「不分組」平均只能給到 <strong>1.00 級</strong>(最優解 1.96 級的 51%)；中離散度時我們的方法(3.41 級，96.4%)明顯贏過 CQI(3.06 級，86.6%)——這是使用者實際會感覺到的畫質落差。" },
  { id: "system_spectral_efficiency", title: "系統頻譜效率 (bps/Hz)", unit: " bps/Hz", decimals: 2,
    insight: "跟 ADR 呈現完全一致的排序(兩者本質上是同一個底層效果的不同量測角度)：中離散度時「不分組」只剩 60.3% 的頻譜效率，高離散度時只剩 27.8%；我們的方法在中離散度(95.7%)穩定領先CQI(75.6%)。" },
  { id: "fairness", title: "公平性 (Jain's Fairness Index)", unit: "", decimals: 4, isPercentMetric: true,
    insight: "⚠️ <strong>「不分組」在每一格公平性都是完美的1.0000</strong>——這不是優點：把所有人塞進同一組，大家拿到「同樣差」的畫質，數學上就是完全公平，但utility/ADR/畫質三項指標同時墊底(見左側各頁)。公平性必須跟其他指標一起看，單獨看沒有意義。<br><br>真正有意義的比較是分組方法之間：<strong>我們的方法在中離散度(0.8510)、高離散度(0.6753)都贏過CQI(0.7996 / 0.6267)</strong>——換頻穩定性感知的候選聯集，除了utility變好，公平性也一併改善，不是犧牲公平性換utility。低離散度時我們的方法公平性(0.9847)略低於CQI(0.9880)，差距很小(<0.4個百分點)。" },
];

/* ---------- CQI+resource-cost hybrid candidate experiment (2026-08-25) ----------
   Source: run_hybrid_candidate_experiment.py, same protocol as the dispersion-
   breakdown slides (150 users, aligned mode, medium load = run_standard_matrix.
   LOAD_RATIOS["medium"]=0.25, 30 seeds x 20 scenarios/cell = 600 scenarios/cell),
   selection objective = the SAME log-utility formula as the formula slide (NOT
   the ADR-only objective explored separately, see `adr-objective-experiment`
   memory -- that experiment found ADR-as-objective does NOT make resource-cost/
   multi-feature beat CQI at high dispersion; this hybrid-candidate mechanism is
   what actually does). */

/* ---------- % of best mini bar chart (paper Figure-4 style) ---------- */
function buildPctChart(values, methodList, unit, decimals) {
  const width = 320, rowH = 30, gap = 10, leftPad = 100, topPad = 6;
  const best = Math.max(...methodList.map(m => values[m.key]));
  const plotRight = width - 44;
  const height = topPad + methodList.length * (rowH + gap) - gap + 4;

  // Category label sits to the LEFT of its own bar, vertically centered on
  // the same row -- never stacked above/below a bar, which earlier testing
  // showed readers misattribute to the neighboring row (see
  // dispersion_and_scale_calibration.md / session notes 2026-08-20).
  let svg = `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="百分比長條圖">`;
  [0, 25, 50, 75, 100].forEach(t => {
    const x = leftPad + (t / 100) * (plotRight - leftPad);
    svg += `<line class="gridline" x1="${x}" y1="${topPad - 2}" x2="${x}" y2="${height - 2}" />`;
  });
  methodList.forEach((m, i) => {
    const v = values[m.key];
    const pct = best > 0 ? (v / best) * 100 : 0;
    const y = topPad + i * (rowH + gap);
    const barY = y + rowH * 0.18;
    const barH = rowH * 0.64;
    const barW = Math.max(((pct / 100) * (plotRight - leftPad)), 2);
    svg += `<text class="cat-label${m.ceiling ? " ceiling" : ""}" x="${leftPad - 8}" y="${barY + barH / 2 + 4}" text-anchor="end">${m.short}</text>`;
    svg += `<rect class="bar" data-idx="${i}" x="${leftPad}" y="${barY}" width="${barW}" height="${barH}" rx="3" fill="${m.color}" />`;
    svg += `<text class="bar-label" x="${leftPad + barW + 6}" y="${barY + barH / 2 + 4}">${pct.toFixed(1)}%</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function attachPctHover(container, methodList, values, unit, decimals) {
  const svg = container.querySelector("svg.chart");
  const tooltip = container.querySelector(".tooltip");
  const best = Math.max(...methodList.map(m => values[m.key]));
  svg.querySelectorAll("rect.bar").forEach((rect, i) => {
    const m = methodList[i];
    const v = values[m.key];
    const pct = best > 0 ? (v / best) * 100 : 0;
    const show = (evt) => {
      const box = container.getBoundingClientRect();
      tooltip.style.left = (evt.clientX - box.left) + "px";
      tooltip.style.top = (evt.clientY - box.top) + "px";
      tooltip.textContent = m.label + " · " + fmtNum(v, decimals) + unit + " · " + pct.toFixed(1) + "% of best";
      tooltip.style.opacity = "1";
    };
    rect.addEventListener("mousemove", show);
    rect.addEventListener("mouseenter", show);
    rect.addEventListener("mouseleave", () => { tooltip.style.opacity = "0"; });
  });
}

function buildRealDataMiniChart(values) {
  const width = 300, rowH = 34, gap = 10, leftPad = 96, rightPad = 60, topPad = 6;
  const plotW = width - leftPad - rightPad;
  const raw = REAL_DATA_METHODS.map(m => values[m.key]);
  const minV = Math.min(0, ...raw);
  const maxV = Math.max(...raw) * 1.15;
  const scale = v => ((v - minV) / (maxV - minV)) * plotW;
  const zeroX = leftPad + scale(0);
  const height = topPad + REAL_DATA_METHODS.length * (rowH + gap);
  let svg = `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="真實資料效用長條圖">`;
  REAL_DATA_METHODS.forEach((m, i) => {
    const v = values[m.key];
    const y = topPad + i * (rowH + gap);
    const barY = y + rowH * 0.16, barH = rowH * 0.56;
    const vx = leftPad + scale(v);
    const x0 = Math.min(zeroX, vx), w = Math.abs(vx - zeroX);
    svg += `<text class="cat-label" x="${leftPad - 8}" y="${y + rowH / 2 + 4}" text-anchor="end">${m.short}</text>`;
    svg += `<rect class="bar" x="${x0}" y="${barY}" width="${Math.max(w, 1)}" height="${barH}" rx="3" fill="${m.color}" />`;
    const anchor = vx >= zeroX ? "start" : "end";
    svg += `<text class="bar-label" x="${vx + (vx >= zeroX ? 6 : -6)}" y="${barY + barH / 2 + 4}" text-anchor="${anchor}" style="font-size:11px;">${fmtNum(v, 3)}</text>`;
  });
  svg += `<line class="baseline-rule" x1="${zeroX}" y1="${topPad - 2}" x2="${zeroX}" y2="${height - 2}" />`;
  svg += `</svg>`;
  return svg;
}

}

    },
    {
      label: "改動 2：為什麼不直接對 [CQI, Cost] 做一次 2 維 clustering？",
      body: `直覺會想：與其分開跑兩次k-means再聯集，直接把CQI跟resource-cost向量<strong>合併成一個特徵空間，跑一次joint clustering</strong>不是更簡單嗎？實測發現<strong>這樣反而是三種方法裡最差的</strong>：高離散度時utility只有0.3147，比單獨CQI(0.3756)、單獨resource-cost(0.3210)都差(雖然還是比「不分組」的0.1229好很多)。原因是joint clustering被迫用<strong>同一組分群同時滿足CQI相似度跟resource-cost相似度兩個目標</strong>，是一種妥協；而分開產生候選、實際跑DP評分後才挑最高分，等於是<strong>依情境自動選用當下最合適的representation</strong>，不需要妥協。<br><br>但這不代表joint clustering完全沒用——<strong>把它加進聯集當「第三個候選來源」</strong>(CQI候選∪Cost候選∪Joint候選)，結果三個離散度都比原本的2-way聯集更好(低+0.0006、中+0.0079、高+0.0019)，而且0個變差。因為聯集只會挑「當下實際分數最高」的那個候選，Joint clustering單獨很差不影響大局，只要它偶爾能找到CQI跟resource-cost都沒找到的切法，就是純粹的加分——這就是<strong>聯集「只會更好、不會更差」的核心機制</strong>。`,

  el.innerHTML = `

    insight: "假設「同時看CQI+Cost相似度」能找到①②各自都找不到的切法。實測<strong>單獨用它是三者中最差的</strong>(被迫同時滿足兩個目標，是一種妥協)，但放進聯集只要偶爾找到更好切法就是純加分——3-way比2-way進步：低+0.0006、中+0.0079、高+0.0019，0個變差。" },
  { tag: "④", name: "Joint[CQI, 前次畫質]", color: "var(--s7)", feature: "①+<code>previous_quality</code> 串接(見下方說明)", dim: "2維", norm: "z-score",
    insight: "Utility公式本來就有換頻懲罰，但①②③做clustering時完全沒看過<code>previous_quality</code>——懲罰只在DP選候選時被動生效，clustering沒機會主動找「換頻穩定」的切法。加入④等於把這個盲點也交給聯集處理——4-way比3-way進步：低+0.0101、中+0.0008、高+0.0091，<strong>三個離散度都是0個變差</strong>。" },
];
const CANDIDATE_SOURCES_ASIDE = [
  { tag: "⑤", name: "RB-profile(側支實驗)", feature: "<code>rb_rates</code> 的 mean/min/max/std", dim: "4維", norm: "z-score",
    insight: "假設per-RB rate的「形狀」(不只平均值)藏有CQI/Cost都看不到的資訊，在ambiguous模式應該更有感。實測只帶來小幅、跟情境模式無關的加分，沒有驗證到原本的假設——列為側支實驗，未納入主線4-way。" },
];
const RECIPES = [
  { label: "2-way(論文方法)", tags: ["①", "②"], ours: false },
  { label: "Joint單一(反例，無聯集)", tags: ["③"], ours: false },
  { label: "3-way", tags: ["①", "②", "③"], ours: false },
  { label: "4-way(我們的方法)", tags: ["①", "②", "③", "④"], ours: true },
  { label: "RB-profile 3-way(側支實驗)", tags: ["①", "②", "⑤"], ours: false },
];
function chipFor(tag) {
  const all = CANDIDATE_SOURCES.concat(CANDIDATE_SOURCES_ASIDE.map(s => ({ ...s, color: "var(--ink-muted)" })));
  const s = all.find(x => x.tag === tag);
  return `<span class="chip" style="--chip-color:${s.color}"><span class="chip-dot"></span>${s.tag} ${s.name}</span>`;
}

function buildCandidateSpecSlide() {
  const el = document.createElement("div");
  el.className = "slide";
  el.innerHTML = `
    <div class="card">
      <span class="kicker">Spec · 候選來源規格表</span>
      <h2 class="slide-title">四個候選來源，各用了哪些變因？</h2>
      <p class="subtitle">每個來源各自對自己的特徵空間跑 k=1..K<sub>max</sub> 的 k-means(plain random-restart)，所有產生出的候選分群方案<strong>取聯集</strong>放進同一個池子，最後由exact DP實際評分、取utility最高者。下表是每個來源實際用的變因。</p>
      <table class="spec-table">
        <thead><tr><th>候選來源</th><th>特徵(實際變因)</th><th>維度・正規化</th><th>為什麼加入 → 如何改進utility</th></tr></thead>
        <tbody>
          ${CANDIDATE_SOURCES.map(s => `<tr>
            <td class="spec-name"><span class="spec-dot" style="background:${s.color}"></span>${s.tag} ${s.name}</td>
            <td>${s.feature}</td>
            <td class="spec-dim">${s.dim}<br>${s.norm}</td>
            <td>${s.insight}</td>
          </tr>`).join("")}
          ${CANDIDATE_SOURCES_ASIDE.map(s => `<tr class="spec-aside">
            <td class="spec-name">${s.tag} ${s.name}</td>
            <td>${s.feature}</td>
            <td class="spec-dim">${s.dim}<br>${s.norm}</td>
            <td>${s.insight}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      <div class="insight">⚠️ <strong><code>previous_quality</code> 不是「上一次的CQI」</strong>，是「上一次被分配到的影片畫質等級」(0~5的整數，對應到200/550/1500/3000/5800/7500 kbps六個等級中的哪一個)。在整份投影片使用的<code>aligned</code>模式下，<code>previous_quality = cqi_now // 3</code>——是目前CQI的一個粗化、<strong>幾乎確定性</strong>的函數(相關係數約0.98)，不是真正獨立的歷史狀態，所以④帶來的獨立資訊量本來就有限；<code>ambiguous</code>模式下previous_quality會疊加隨機擾動、不再是CQI的確定性函數，理論上④應該更有價值，但目前尚未針對這點重新驗證。</div>
      <p style="margin:6px 0 0; font-size:0.76rem; color:var(--ink-muted); font-weight:700; letter-spacing:0.04em;">2-way ~ 4-way 怎麼組成的</p>
      <div class="recipe-list">
        ${RECIPES.map(r => `
          <div class="recipe-row${r.ours ? " recipe-ours" : ""}">
            <span class="recipe-label">${r.label}</span>
            <span class="recipe-chips">
              ${r.tags.map((t, i) => (i > 0 ? `<span class="op">∪</span>` : "") + chipFor(t)).join("")}
            </span>
          </div>
        `).join("")}
      </div>
    </div>
  `;
  return el;
}

function buildHybridResultsSlide() {
  const el = document.createElement("div");
  el.className = "slide";
  const panels = DISPERSIONS.map(d => `
    <div class="panel">
      <h3>${d.label}</h3>
      <p class="panel-sub">% 為該情境下相對「最佳方法」的比例；vs CQI(現有)：4-way(我們) ${HYBRID4_VS_CQI[d.key].win}勝/${HYBRID4_VS_CQI[d.key].tie}平/${HYBRID4_VS_CQI[d.key].loss}負(共600情境)</p>
      <div class="chart-wrap" data-disp="${d.key}"><div class="tooltip"></div></div>
    </div>`).join("");
  el.innerHTML = `
    <div class="card">
      <span class="kicker">Ablation · 效用分數 (Utility Score) · 依 CQI 離散度分層(150 使用者 · aligned 模式 · medium 負載 · 30 seed × 20 情境/格)</span>
      <h2 class="slide-title">為什麼是這個設計：從單一方法到 4-way 候選聯集</h2>
      <p class="subtitle">下面每個百分比都是 <strong>utility</strong>(跟前面「Utility 公式」頁同一套公平性加權log-utility)，不是ADR。這頁展示候選聯集怎麼一步步疊上來的，以及為什麼每一步都合理。</p>
      <div class="legend">${HYBRID_METHODS.map(m => `<span class="legend-item"><span class="legend-dot" style="background:${m.color}"></span>${m.short}${m.ceiling ? "(多排序鍵ensemble修正版，已確認接近真實全域最優解——小規模195/195brute-force全命中，n=150低離散度0%淨損失)" : ""}</span>`).join("")}</div>
      <div class="panel-grid">${panels}</div>
      <div class="insight">⚠️ <strong>「Joint(反例)」— 直接把CQI跟resource-cost合併成一個特徵空間做單一clustering，反而是最差的方法之一</strong>：高離散度時只有近似最優解的71.3%，甚至輸給單獨的resource-cost(72.7%)，因為被迫用同一組分群同時滿足兩個目標，是一種妥協。<br><br>✅ <strong>把Joint加進聯集(3-way)、再加換頻穩定性(4-way)，兩次都只有變好、沒有變差(0個loss)</strong>：低離散度從2-way的98.9%一路推到4-way的<strong>100.0%(幾乎完全命中近似最優解，只差0.0001)</strong>；中離散度2-way(94.8%)→3-way(95.8%)→4-way(<strong>95.9%</strong>)；高離散度2-way(86.8%)→3-way(87.3%)→4-way(<strong>89.3%</strong>，306/600情境贏CQI、294平、0負)。每一步都是「多加一個候選來源，讓聯集自動挑當下最合適的」，即使新加的來源單獨測很差(像Joint)也不影響大局——這就是本頁的核心論點：<strong>候選聯集是一個只會變好、不會變差的設計</strong>，不需要猜哪個representation最好，讓實際DP評分決定就好。<br><br>💡 <strong>移除k-means++後(2026-08-25)</strong>：2-way/3-way/4-way在三個離散度對CQI k-means的勝負從原本偶有小輸(如舊版低離散度10負、高離散度62~77負)全部變成<strong>0負</strong>——因為候選聯集裡的CQI候選現在跟baseline用同一個seed、同一種plain random-restart，保證至少打平，不會再輸。</div>
    </div>
  `;
  el.querySelectorAll(".chart-wrap").forEach(wrap => {
    const disp = wrap.getAttribute("data-disp");
    const values = HYBRID_DATA[disp];
    const svg = buildPctChart(values, HYBRID_METHODS, "", 4);
    wrap.insertAdjacentHTML("afterbegin", svg);
    attachPctHover(wrap, HYBRID_METHODS, values, "", 4);
  });
  return el;
}

function buildHybridRealDataSlide() {
  const el = document.createElement("div");
  el.className = "slide";
  const dispRowLabel = { low: "低離散度", mid: "中離散度", high: "高離散度" };
  const rows = DISPERSIONS.map(d => `
    <tr>
      <th>${dispRowLabel[d.key]}</th>
      ${HYBRID_REAL_LOADS.map(l => {
        const c = HYBRID_REAL_WTL[d.key][l.key];
        const tier = wtlTier(c);
        return `<td class="wtl-cell ${tier}">
          <div class="wtl-count">${c.win}勝 / ${c.tie}平 / ${c.loss}負</div>
          <div class="wtl-diff">${c.diff >= 0 ? "+" : ""}${c.diff.toFixed(4)} vs CQI</div>
        </td>`;
      }).join("")}
    </tr>`).join("");
  el.innerHTML = `
    <div class="card">
      <span class="kicker">Bonus · 效用分數 (Utility Score) · 真實 Simu5G + SUMO + Veins，10 個獨立seed(非合成資料)</span>
      <h2 class="slide-title">Hybrid 方法在真實資料上的驗證(效用分數)</h2>
      <p class="subtitle">同一份10-seed真實資料集(見前面「真實資料驗證」頁)，把Hybrid <strong>2-way</strong>方法(CQI∪Cost，論文方法)加進三方法比較——每一格是10個獨立seed對CQI k-means的<strong>utility</strong>勝/平/負(跟「Utility 公式」頁同一套公平性加權log-utility，不是ADR)，深綠=9~10勝，外框綠=有輸有贏但淨值仍正向，白底=完全打平。<em>3-way(+Joint)、4-way(+換頻穩定性，我們目前最佳的版本)目前只在合成資料驗證過，真實資料驗證待補。</em></p>
      <table class="wtl-table">
        <thead><tr><th class="corner"></th>${HYBRID_REAL_LOADS.map(l => `<th>${l.label} 負載</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="insight"><strong>9個(離散度×負載)組合裡，Hybrid在任何一格都沒有輸過一次(0負)</strong>——5格是10/10或9/1全勝(mid×light/medium、high×light/medium、high×heavy的9勝1平)，其餘都是打平或平打平(low×all三格全平、mid×heavy是5勝5平0負)。對比同一份真實資料上單獨測的resource-cost/multi-feature(在mid×heavy、high×medium都是2~3勝、7~8負)，Hybrid明顯更穩定——這跟合成資料的發現完全一致(合成資料上2-way/3-way/4-way聯集移除k-means++後同樣是0負)，而且真實資料上的表現又更乾淨。<br><br>💡 移除k-means++後，mid×heavy這一格從舊版的4勝4平2負進步到5勝5平0負(+0.0012 vs CQI)——這是唯一一格數字有感變動的地方，其餘8格win/tie/loss結構基本不變。</div>
    </div>
  `;
  return el;
}

function buildTakeawaySlide() {
  const el = document.createElement("div");
  el.className = "slide";
  const items = [
    { color: "var(--s1)", html: "<strong>「不分組」的表現完全取決於離散度、也受使用者數量放大</strong>：低離散度時它甚至是最好的(不需要分組)，中離散度已有感知得到的差距(150人時約60%)，高離散度崩到只剩最優解的 28%——跟原論文 Method C 的量級一致。使用者數從24人拉到500人時，中離散度的ADR差距單調擴大(85%→65%→60%→56%→43%)；高離散度時「不分組」的絕對ADR從150人起卡在550kbps不再下降(見「使用者數量的影響」頁)。" },
    { color: "var(--s7)", html: "<strong>Headline：候選聯集(CQI+Resource-cost+Joint+換頻穩定性，4-way)在合成與真實資料上都不輸 CQI k-means</strong>——4-way在三個離散度都達到近似最優解的89%以上(低100.0%、中95.9%、高89.3%)，其中低離散度已幾乎完全逼近最優解(0.9514 vs 0.9515，只差0.0001)；真實10-seed資料上2-way版本在全部9個(離散度×負載)組合都沒有輸過一次(0負)，utility、average quality、fairness三項指標在中/高離散度同時都贏過CQI(不是犧牲公平性換utility)。關鍵機制是「聯集」本身：同一份[CQI,cost]直接做單一joint clustering在高離散度還是輸給單獨resource-cost(0.3147 vs 0.3210)；分開產生候選、實際跑DP評分後再挑最高分，才能讓每種representation只在它真正有優勢的情境被採用。2026-08-25移除k-means++當作候選產生時的初始化變因後(全部改回跟baseline一致的plain random-restart)，2-way/3-way/4-way聯集對CQI k-means的勝負在三個離散度都變成0負——這是目前最站得住腳、不需要深度學習的核心結果。" },
    { color: "var(--s5)", html: "<strong>「近似最優解」用的是驗證過的多排序鍵ensemble修正版</strong>(offline_teacher_groups_multikey，不是單一排序鍵的原始版)：原始版DP只在「依資源成本排序後取連續切割」的受限空間內窮舉，低離散度時因CQI大量重複值(只剩13/14/15三種)而失真，utility甚至會被multi-feature/CQI k-means超過；換成修正版後，utility指標在每一格都確實是最高分。中/高離散度時所有啟發式方法(含我們的4-way)都還沒觸頂，還有進步空間；高離散度時 CQI 的原始 ADR 甚至超過它，因為它優化的是含公平性的 log-utility，不是原始平均速率，兩者目標不同。ADR/served_ratio/quality/spectral_efficiency/fairness這5項指標目前仍用較便宜的單排序鍵版本當參考，尚未重新驗證是否仍是每格最高分。" },
    { color: "var(--s2)", html: "<strong>真實 Simu5G 資料(10 個獨立seed)</strong>複現了「離散度才是分組價值的關鍵」——中/高離散度時「不分組」在全部10個seed都輸；但也修正了先前只跑1個seed時「resource-cost明顯贏CQI」的結論：擴大到10個seed後，同樣負載下CQI反而多數時候贏，方向不穩健，不能只憑1個seed下定論。" },
  ];
  el.innerHTML = `
    <div class="card" style="align-items:flex-start;">
      <span class="kicker">總結</span>
      <h2 class="slide-title">結論</h2>
      <div class="takeaways">${items.map(it => `<div class="takeaway"><span class="dot" style="background:${it.color}"></span><p>${it.html}</p></div>`).join("")}</div>
    </div>
  `;
  return el;
}

/* ---------- assemble deck ---------- */
const slidesEl = document.getElementById("slides");
const slideEls = [
  buildTitleSlide(),
  buildFormulaSlide(),
  buildHybridLogicSlide(),
  buildCandidateSpecSlide(),
  buildHybridResultsSlide(),
  ...METRIC_META.map(buildDispersionMetricSlide),
  buildUserCountSlide(),
  buildRealDataSlide(REAL_DATA),
  buildHybridRealDataSlide(),
  buildTakeawaySlide(),
];
slideEls.forEach(s => slidesEl.appendChild(s));

let current = 0;
const dotsEl = document.getElementById("dots");
slideEls.forEach((_, i) => {
  const b = document.createElement("button");
  b.setAttribute("aria-label", "第 " + (i + 1) + " 頁");
  b.addEventListener("click", () => goTo(i));
  dotsEl.appendChild(b);
});
const counterEl = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function render() {
  slideEls.forEach((s, i) => s.classList.toggle("active", i === current));
  [...dotsEl.children].forEach((d, i) => d.classList.toggle("on", i === current));
  counterEl.textContent = (current + 1) + " / " + slideEls.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slideEls.length - 1;
}
function goTo(i) { current = Math.max(0, Math.min(slideEls.length - 1, i)); render(); }
prevBtn.addEventListener("click", () => goTo(current - 1));
nextBtn.addEventListener("click", () => goTo(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { goTo(current + 1); e.preventDefault(); }
  if (e.key === "ArrowLeft") { goTo(current - 1); e.preventDefault(); }
});
render();
</script>
